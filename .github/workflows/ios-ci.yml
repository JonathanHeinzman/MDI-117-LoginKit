name: iOS CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Checkout Repository
      uses: actions/checkout@v4

      - name: Report toolchain
      run: xcodebuild -version
    
    - name: Select an available iPhone
      run: |
        xcrun simctl list devices available --json > "$RUNNER
        _
        TEMP/devices.json"
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        devices = json.loads(
        (Path(os.environ['RUNNER
        _
        TEMP']) / 'devices.json').read
        _
        text())['devices']
        candidates = [d for runtime, entries in devices.items() if '
        .iOS-
        ' in runtime
        for d in entries if d['isAvailable'] and d['name'].startswith('iPhone')]
        if not candidates:
        raise SystemExit('No available iPhone simulator on this runner')
        device = candidates[0]
        with open(os.environ['GITHUB
        _
        ENV'],
        'a') as out:
        out.write(f"DESTINATION=platform=iOS Simulator,id={device['udid']}\n")
        print(f"Selected {device['name']} ({device['udid']})")
        PY
    - name: Run tests
    run: >-
    xcodebuild test
    -project MDI1-117-Ch-9-LoginKit/MDI1-117-Ch-9-LoginKit.xcodeproj
    -scheme "MDI1-117-Ch-9-LoginKit"
    -destination "$DESTINATION"
    -parallel-testing-enabled NO
    -resultBundlePath TestResults.xcresult
    CODE
    SIGNING
    ALLOWED=NO
    _
    _
    - name: Upload test results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: TestResults
      path: TestResults.xcresult
      if-no-files-found: ignore